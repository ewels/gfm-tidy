#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "v3.9.6"
hooks = [{ id = "prettier" }]

[[repos]]
repo = "local"
hooks = [
    { id = "tests", name = "tests", entry = "node tests/test.cjs", language = "system", files = "\\.(c?js)$", pass_filenames = false },
    { id = "fixtures", name = "fixtures", entry = "python3 tests/fixtures.py", language = "system", files = "\\.(c?js|html)$", pass_filenames = false },
]
